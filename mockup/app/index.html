<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox2Order · An Phát</title>
  <!-- Tailwind đã biên dịch sẵn (build_mockup.py); nếu chưa có tệp này thì dùng bản CDN -->
  <link rel="stylesheet" href="tailwind.css" onerror="var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s)">
  <style>
    body { font-family: "Inter", "Segoe UI", "Helvetica Neue", "DejaVu Sans", Arial, sans-serif; }
    .review { background: #fffbeb; box-shadow: inset 3px 0 0 #f59e0b; }
    .tabnum { font-variant-numeric: tabular-nums; }
    .ico { width: 1rem; height: 1rem; flex: none; }
    .toast-in { animation: tin .2s ease-out; }
    @keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    /* hiệu ứng cơ bản */
    a, button, select, input, textarea, tr, section, .chip { transition: background-color .15s, color .15s, border-color .15s, box-shadow .2s, transform .15s; }
    #app > * { animation: fadeup .28s ease-out both; }
    #app > *:nth-child(2) { animation-delay: .04s; } #app > *:nth-child(3) { animation-delay: .08s; }
    #app > *:nth-child(4) { animation-delay: .12s; } #app > *:nth-child(5) { animation-delay: .16s; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    section.shadow-sm:hover { box-shadow: 0 6px 18px -8px rgb(15 23 42 / .18); }
    button.st:hover, .kpi:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px rgb(79 70 229 / .35); }
    button:not(:disabled):active { transform: scale(.97); }
    button:not(:disabled) { cursor: pointer; }
    tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 #6366f1; }
    tbody tr.review:hover td:first-child { box-shadow: inset 3px 0 0 #f59e0b; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px rgb(199 210 254 / .7); }
    #nav a:hover svg { transform: translateY(-1px); } #nav a svg { transition: transform .15s; }
    #modal:not(.hidden) > div { animation: pop .18s ease-out; }
    @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    #modal:not(.hidden) { animation: fade .15s ease-out; } @keyframes fade { from { opacity: 0; } }
    details summary:hover { color: #4f46e5; }
    .bar-grow { animation: grow .6s ease-out both; transform-origin: left; } @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 text-sm antialiased">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-[1400px] mx-auto px-6 h-16 flex items-center gap-8">
      <a href="#hop-thu" class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-sm">
          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H15l-3 3-3-3H4z"/><path d="M8 9h8M8 12h5"/></svg>
        </span>
        <span class="leading-tight"><span class="block font-semibold text-slate-900">Inbox2Order</span>
          <span class="block text-xs text-slate-500">An Phát · donhang@anphat.example.vn</span></span>
      </a>
      <nav id="nav" class="flex gap-1"></nav>
      <div class="ml-auto flex items-center gap-3">
        <span class="text-xs text-slate-500">Đang dùng:</span>
        <span id="avatar" class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 text-xs font-semibold flex items-center justify-center"></span>
        <select id="role" class="border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200"></select>
      </div>
    </div>
  </header>
  <main id="app" class="max-w-[1400px] mx-auto px-6 py-6"></main>
  <footer class="max-w-[1400px] mx-auto px-6 pb-6 text-xs text-slate-400">Bản demo: mọi thao tác chỉ thay đổi dữ liệu trong trình duyệt; tải lại trang để về dữ liệu ban đầu.</footer>
  <div id="modal" class="hidden fixed inset-0 z-30 bg-slate-900/40 flex items-center justify-center"></div>
  <div id="toast" class="fixed bottom-5 right-5 z-40 space-y-2"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
